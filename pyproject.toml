[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "py-rag-eval"
version = "0.1.0"
description = "Build, measure and compare retrieval-augmented generation pipelines with reproducible, offline-first experiments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bhavana Sanal" }]
requires-python = ">=3.12"
keywords = ["rag", "retrieval", "evaluation", "bm25", "llm", "information-retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[project.urls]
Repository = "https://github.com/bhavana-sanal/py-rag-eval"
Issues = "https://github.com/bhavana-sanal/py-rag-eval/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "RET", "PL", "NPY"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
strict = true
packages = ["rag_eval"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sentence_transformers"]
ignore_missing_imports = true
